name: Refresh About page statistics

# The About page statistics are generated data, not hand-edited content.
# This workflow fetches fresh public figures from GitHub, Stepik and StepStat
# and commits the refreshed `src/data/about-stats.json` back to the
# repository, so the next build of the site shows the updated numbers.
#
# The schedule is configurable: edit the `cron` expression below.
# LinkedIn is best-effort — the profile blocks unauthenticated requests, so a
# failure there is expected and does not fail the workflow.

on:
  schedule:
    # 03:30 UTC every Monday and Thursday. Adjust freely.
    - cron: '30 3 * * 1,4'
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh the statistics
        run: node --experimental-strip-types scripts/refresh-data.ts

      - name: Commit the refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/about-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add src/data/about-stats.json
            git commit -m "chore: refresh about-page statistics (automated)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the refreshed data
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}
